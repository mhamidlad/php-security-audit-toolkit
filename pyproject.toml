[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "php-security-audit-toolkit"
version = "0.1.0"
description = "Find PHP security risks. Understand the findings. Fix them. Verify the results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Hamid" },
]
keywords = ["php", "security", "audit", "sast", "static-analysis", "application-security", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
php-security-audit = "php_audit.cli:app"

[project.urls]
Homepage = "https://github.com/mhamidlad/php-security-audit-toolkit"
Repository = "https://github.com/mhamidlad/php-security-audit-toolkit"
Issues = "https://github.com/mhamidlad/php-security-audit-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/php_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
