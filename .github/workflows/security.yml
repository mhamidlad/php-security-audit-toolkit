name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run security scan on self
        run: |
          php-security-audit scan ./src --format sarif --output /tmp/self-scan.sarif || true

      - name: Validate SARIF
        run: python -c "import json; json.load(open('/tmp/self-scan.sarif')); print('Valid SARIF')"
