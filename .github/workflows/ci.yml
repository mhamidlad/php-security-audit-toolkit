name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Verify CLI starts
        run: php-security-audit --version

      - name: Run scanner on examples
        run: php-security-audit scan ./examples/vulnerable --format json --output /tmp/scan.json || true

      - name: Validate JSON output
        run: python -c "import json; d = json.load(open('/tmp/scan.json')); assert len(d['findings']) > 0; print('Valid JSON with', len(d['findings']), 'findings')"

      - name: Generate SARIF
        run: php-security-audit scan ./examples/vulnerable --format sarif --output /tmp/scan.sarif || true

      - name: Validate SARIF output
        run: python -c "import json; d = json.load(open('/tmp/scan.sarif')); assert len(d['runs'][0]['results']) > 0; print('Valid SARIF with', len(d['runs'][0]['results']), 'results')"
