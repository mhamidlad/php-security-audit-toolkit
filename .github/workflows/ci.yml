name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Verify CLI starts
        run: php-security-audit --version

      - name: Run scanner on examples
        run: php-security-audit scan ./examples/vulnerable --format json --output /tmp/scan.json

      - name: Validate JSON output
        run: python -c "import json; json.load(open('/tmp/scan.json')); print('Valid JSON')"

      - name: Generate SARIF
        run: php-security-audit scan ./examples/vulnerable --format sarif --output /tmp/scan.sarif

      - name: Validate SARIF output
        run: python -c "import json; json.load(open('/tmp/scan.sarif')); print('Valid SARIF')"
